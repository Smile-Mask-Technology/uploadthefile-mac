name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      # With Xcode installed (as on GitHub's macOS runners) plain `swift test` runs the
      # Swift Testing suites; scripts/test.sh falls back to it there. It fails when the run
      # reports no tests or fewer than scripts/min-test-count.
      - name: Test
        run: scripts/test.sh
      - name: Release build (ad-hoc signed app)
        run: scripts/build-app.sh
      - name: The release binary carries no debug snapshot code
        run: |
          if strings "build/Upload the File.app/Contents/MacOS/UploadTheFile" | grep -q render-snapshots; then
            echo "render-snapshots found in the release binary" >&2
            exit 1
          fi
